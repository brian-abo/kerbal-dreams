// KerbalDreams Science Definitions
// Custom experiment results for all bodies in the Urva system

// ============================================================================
// USIN
// ============================================================================

@EXPERIMENT_DEFINITION[crewReport]
{
    @RESULTS
    {
        UsinSrfLanded = The gravity here is brutal. Every movement takes deliberate effort. The crew recommends limiting EVA time.
        UsinSrfLandedGoldenMesas = The golden formations look even more impressive up close. Jeb keeps trying to pocket samples.
        UsinInSpaceLow = The crew observes Usin's stark surface from orbit. The golden mesas are visible even from here.
        UsinInSpaceHigh = Usin is a small dark disc against Urva's glow. Hard to believe something that small has such crushing gravity.
    }
}

@EXPERIMENT_DEFINITION[evaReport]
{
    @RESULTS
    {
        UsinSrfLanded = Standing on Usin is exhausting. The 2.12g gravity makes the EVA suit feel like it weighs a ton.
        UsinSrfLandedGoldenMesas = The golden rock here has an unusual crystalline structure. It's beautiful, but incredibly heavy.
        UsinSrfLandedObsidianFlats = The dark surface absorbs nearly all light. It's eerily quiet and flat.
        UsinInSpaceLow = Floating above Usin, you can appreciate its alien beauty without the crushing weight.
    }
}

@EXPERIMENT_DEFINITION[surfaceSample]
{
    @RESULTS
    {
        UsinSrfLanded = The surface material is remarkably dense. This small sample weighs far more than expected.
        UsinSrfLandedGoldenMesas = The golden sample contains high concentrations of heavy metallic elements. Remarkable.
        UsinSrfLandedObsidianFlats = Black vitreous rock, extremely dense. It would make a terrible paperweight — it would crush the desk.
        UsinSrfLandedCraterFields = Impact-shocked material with an unusual mineral composition. The collision history here is complex.
        UsinSrfLandedDarkRidges = Compressed metamorphic rock from deep within Usin's crust, forced upward by tectonic stress.
    }
}

// ============================================================================
// MYUN
// ============================================================================

@EXPERIMENT_DEFINITION[crewReport]
{
    @RESULTS
    {
        MyunSrfSplashed = The crew reports calm seas as far as the eye can see. The ring system is breathtaking from the surface.
        MyunSrfSplashedOpenOcean = Nothing but open water in every direction. The ocean is remarkably clear.
        MyunSrfSplashedDeepTrench = Sonar readings suggest the ocean floor drops away dramatically here. It's deep.
        MyunSrfSplashedShallows = The water here is shallow enough to see strange formations on the ocean floor.
        MyunSrfSplashedRingShadowZone = The rings cast a dramatic shadow across the water. The light here has an unusual quality.
        MyunFlyingLow = Flying low over Myun's endless ocean. The water reflects Urva's light like liquid gold.
        MyunFlyingHigh = The curvature of Myun is visible, its rings cutting a bright arc across the sky.
        MyunInSpaceLow = Myun is a perfect blue sphere banded by its magnificent ring system.
        MyunInSpaceHigh = From here, Myun and its rings are one of the most beautiful sights in the system.
    }
}

@EXPERIMENT_DEFINITION[evaReport]
{
    @RESULTS
    {
        MyunSrfSplashed = Floating on Myun's ocean. The water is warm and the air is breathable. Almost pleasant, if you ignore being light-years from home.
        MyunFlyingLow = The wind carries a faint salt-like scent. Myun's atmosphere is surprisingly comfortable.
        MyunInSpaceLow = The rings cast thin shadows across the ocean below. Three tiny asteroid moons are visible.
    }
}

// ============================================================================
// ASTEROID MOONS (Renn, Tavi, Koss)
// ============================================================================

@EXPERIMENT_DEFINITION[crewReport]
{
    @RESULTS
    {
        RennSrfLanded = Gravity is almost nonexistent here. The crew floats more than walks on Renn's battered surface.
        RennInSpaceLow = Renn is a small, tumbling rock. Myun and its rings dominate the view behind it.
        TaviSrfLanded = Tavi's rust-colored surface crunches underfoot. In the low gravity, every step sends you drifting.
        TaviInSpaceLow = Tavi's irregular shape is apparent from orbit. It's clearly a captured asteroid.
        KossSrfLanded = Koss is tiny and dark. You could almost throw a rock into orbit from here.
        KossInSpaceLow = The smallest of Myun's moons barely holds itself together gravitationally.
    }
}

@EXPERIMENT_DEFINITION[evaReport]
{
    @RESULTS
    {
        RennSrfLanded = You can jump several meters with minimal effort. The view of Myun's rings from here is spectacular.
        TaviSrfLanded = The regolith has a reddish tint. Tavi seems to be compositionally different from its sibling moons.
        KossSrfLanded = Be very careful with your RCS jets — escape velocity here is walking speed.
    }
}

@EXPERIMENT_DEFINITION[surfaceSample]
{
    @RESULTS
    {
        RennSrfLanded = Grey regolith with embedded metallic fragments. Standard chondritic composition.
        TaviSrfLanded = Rust-colored surface material with iron oxide content. Tavi may have originated from a different parent body.
        KossSrfLanded = Dark carbonaceous material. Koss appears to be a captured C-type asteroid.
    }
}

// ============================================================================
// KENKAN
// ============================================================================

@EXPERIMENT_DEFINITION[crewReport]
{
    @RESULTS
    {
        KenkanFlyingLow = The atmosphere is a swirling maelstrom of magenta and indigo. Pressure is rising rapidly.
        KenkanFlyingHigh = High in Kenkan's atmosphere, the indigo cloud bands stretch to the horizon.
        KenkanInSpaceLow = Kenkan's magenta-red atmosphere is mesmerizing. Indigo storm bands swirl across its disc.
        KenkanInSpaceHigh = The small ice giant is a vivid splash of color against the black void.
    }
}

@EXPERIMENT_DEFINITION[evaReport]
{
    @RESULTS
    {
        KenkanInSpaceLow = The view of Kenkan from EVA is breathtaking. The magenta and indigo color palette is unlike anything in the Kerbol system.
    }
}

// ============================================================================
// MOZAZ
// ============================================================================

@EXPERIMENT_DEFINITION[crewReport]
{
    @RESULTS
    {
        MozazSrfLanded = The brown slushy ground squelches under your landing gear. The ammonia smell is detectable even through the hull.
        MozazSrfLandedAmmoniaSea = Splashed down in the ammonia sea. Do NOT open the hatch.
        MozazSrfLandedPolarIceCap = The northern ice cap is brilliant white, a stark contrast to the brown slush elsewhere.
        MozazSrfLandedSlushFields = The ground is a semi-frozen mixture of ammonia compounds. It has the consistency of wet snow.
        MozazSrfLandedRidgeline = Rocky ridges poke through the slush, offering the only solid ground on Mozaz.
        MozazSrfSplashed = The ammonia ocean is a murky yellow-brown. Instrument readings are fascinating but the smell is not.
        MozazFlyingLow = A chemical haze hangs over the ammonia seas. Kenkan looms large on the horizon.
        MozazFlyingHigh = From altitude, the white ice cap and brown surface create a striking two-tone appearance.
        MozazInSpaceLow = Mozaz appears as a brown marble with a single white dot at the north pole.
        MozazInSpaceHigh = Kenkan's lone moon is small but scientifically rich. The ammonia oceans beg for closer study.
    }
}

@EXPERIMENT_DEFINITION[evaReport]
{
    @RESULTS
    {
        MozazSrfLanded = The EVA suit's filters are working overtime. The ammonia concentration is extremely high.
        MozazSrfLandedPolarIceCap = The ice here is water ice, not ammonia. It's the only familiar substance on this moon.
        MozazSrfLandedSlushFields = Walking through the slush is difficult. Each step sinks ankle-deep.
        MozazSrfSplashed = DO NOT remove your helmet. The ammonia concentration would be instantly lethal.
        MozazInSpaceLow = Mozaz is a fascinating and terrifying world. Beautiful from orbit, deadly up close.
    }
}

@EXPERIMENT_DEFINITION[surfaceSample]
{
    @RESULTS
    {
        MozazSrfLanded = The sample is a brown semi-frozen slurry of ammonia compounds and silicate dust.
        MozazSrfLandedPolarIceCap = Pure water ice with trace ammonia contamination. Surprisingly clean for this world.
        MozazSrfLandedSlushFields = Ammonia slush mixed with complex organic compounds. The chemistry here is extraordinary.
        MozazSrfLandedRidgeline = Silicate rock coated in ammonia frost. The underlying geology is unremarkable.
        MozazSrfSplashed = A sample of the ammonia ocean. Handle with extreme care — this is not something you want to spill in the lab.
    }
}

// ============================================================================
// ICARI
// ============================================================================

@EXPERIMENT_DEFINITION[crewReport]
{
    @RESULTS
    {
        IcariSrfLanded = The dark red-orange surface is coated in complex organic tholins. It's hauntingly beautiful and deathly quiet.
        IcariSrfLandedTholinPlains = Vast plains of tholin-covered terrain stretch to the horizon. The red-orange color is vivid even in the dim light.
        IcariSrfLandedGreenPatches = The green-tinted areas are chemically distinct from the surrounding tholins. Their origin remains a mystery.
        IcariSrfLandedImpactBasins = Ancient impact basins reveal layered tholin deposits, each representing millions of years of accumulation.
        IcariSrfLandedPolarWastes = The poles are slightly darker and colder than the rest of the surface. The tholins here have a different texture.
        IcariInSpaceLow = Icari's red-orange surface is broken by patches of unexplained green. It's a world of chemical mysteries.
        IcariInSpaceHigh = Alone in the outer reaches of the Urva system, Icari is a dark, cold, enigmatic world.
    }
}

@EXPERIMENT_DEFINITION[evaReport]
{
    @RESULTS
    {
        IcariSrfLanded = The tholin surface crunches softly underfoot. Urva is just a bright star from here.
        IcariSrfLandedGreenPatches = The green material has an unusual texture — waxy and slightly translucent. What is this stuff?
        IcariSrfLandedTholinPlains = Red-orange dust coats everything within minutes of landing. It gets into every joint and seal.
        IcariInSpaceLow = Icari is a lonely world. The contrast between red tholins and green patches is striking from orbit.
    }
}

@EXPERIMENT_DEFINITION[surfaceSample]
{
    @RESULTS
    {
        IcariSrfLanded = A sample of tholin material — complex organic compounds built by billions of years of radiation chemistry.
        IcariSrfLandedTholinPlains = Rich tholin deposits. Analysis reveals long-chain hydrocarbons and nitrile compounds.
        IcariSrfLandedGreenPatches = The green material contains copper-bearing minerals mixed with organic compounds. Unique in the system.
        IcariSrfLandedImpactBasins = Impact-shocked tholins with exposed subsurface material. The underlying rock is unremarkable silicate.
        IcariSrfLandedPolarWastes = Polar tholins with higher nitrogen content. The cold here preserves some very delicate molecular structures.
    }
}
