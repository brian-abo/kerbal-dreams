Localization
{
    en-us
    {
        // Star
        #LOC_KerbalDreams_Urva = Urva
        #LOC_KerbalDreams_Urva_desc = A warm yellow star burning steadily at the heart of a distant system. Its light reaches across four worlds, each shaped by the particular forces of this quiet corner of the galaxy.

        // Planet 1 - Usin
        #LOC_KerbalDreams_Usin = Usin
        #LOC_KerbalDreams_Usin_desc = A massive, extraordinarily dense world orbiting close to Urva. Its surface is dominated by vast black rock plains punctuated by towering golden mesas — a consequence of the planet's unusually high concentration of heavy metallic elements. With a crushing surface gravity of 2.12g, any landing here is a serious commitment.
        #LOC_KerbalDreams_Usin_biome_GoldenMesas = Golden Mesas
        #LOC_KerbalDreams_Usin_biome_ObsidianFlats = Obsidian Flats
        #LOC_KerbalDreams_Usin_biome_CraterFields = Crater Fields
        #LOC_KerbalDreams_Usin_biome_DarkRidges = Dark Ridges

        // Planet 2 - Myun
        #LOC_KerbalDreams_Myun = Myun
        #LOC_KerbalDreams_Myun_desc = A serene ocean world wrapped in a breathable atmosphere. Myun has no landmasses — its surface is a single, unbroken global ocean stretching from pole to pole with no ice caps. A magnificent ring system arcs across its sky, and three small captured asteroids trace irregular paths through its sphere of influence.
        #LOC_KerbalDreams_Myun_biome_OpenOcean = Open Ocean
        #LOC_KerbalDreams_Myun_biome_DeepTrench = Deep Trench
        #LOC_KerbalDreams_Myun_biome_Shallows = Shallows
        #LOC_KerbalDreams_Myun_biome_RingShadowZone = Ring Shadow Zone

        // Myun Moons
        #LOC_KerbalDreams_Renn = Renn
        #LOC_KerbalDreams_Renn_desc = The largest of Myun's three captured asteroid moons. Renn tumbles through an inclined orbit, its battered grey surface bearing the scars of countless ancient collisions.

        #LOC_KerbalDreams_Tavi = Tavi
        #LOC_KerbalDreams_Tavi_desc = A small, rust-tinted asteroid caught in Myun's gravitational embrace. Tavi's highly inclined orbit suggests it was captured from a very different trajectory than its siblings.

        #LOC_KerbalDreams_Koss = Koss
        #LOC_KerbalDreams_Koss_desc = The smallest and most distant of Myun's asteroid moons. Koss follows a wild, highly eccentric orbit that nearly escapes the ocean world's grip with each pass.

        // Planet 3 - Kenkan
        #LOC_KerbalDreams_Kenkan = Kenkan
        #LOC_KerbalDreams_Kenkan_desc = A compact ice giant swathed in a striking magenta-red atmosphere streaked with bands of deep indigo cloud. Smaller than the ice giants of other systems, Kenkan is nonetheless a formidable world with crushing atmospheric pressure and a single intriguing moon.

        // Kenkan Moon - Mozaz
        #LOC_KerbalDreams_Mozaz = Mozaz
        #LOC_KerbalDreams_Mozaz_desc = Kenkan's lone moon is a world of ammonia seas and brown slush. A single brilliant ice cap dominates the northern hemisphere, while the rest of the surface is a murky expanse of semi-frozen ammonia compounds. The thin atmosphere carries a faint chemical haze.
        #LOC_KerbalDreams_Mozaz_biome_AmmoniaSea = Ammonia Sea
        #LOC_KerbalDreams_Mozaz_biome_PolarIceCap = Polar Ice Cap
        #LOC_KerbalDreams_Mozaz_biome_SlushFields = Slush Fields
        #LOC_KerbalDreams_Mozaz_biome_Ridgeline = Ridgeline

        // Planet 4 - Icari
        #LOC_KerbalDreams_Icari = Icari
        #LOC_KerbalDreams_Icari_desc = The outermost world of the Urva system, Icari drifts through the cold dark on a lonely, inclined orbit. Its surface is coated in dark red-orange tholins — complex organic compounds formed by radiation acting on simple molecules over billions of years. Mysterious patches of green coloration hint at chemical processes not yet understood.
        #LOC_KerbalDreams_Icari_biome_TholinPlains = Tholin Plains
        #LOC_KerbalDreams_Icari_biome_GreenPatches = Green Patches
        #LOC_KerbalDreams_Icari_biome_ImpactBasins = Impact Basins
        #LOC_KerbalDreams_Icari_biome_PolarWastes = Polar Wastes
    }
}
